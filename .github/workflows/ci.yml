name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
      - 'fix/**'

permissions:
  contents: read

concurrency:
  group: valguiden-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Build Chat and Custom GPT distributions
        run: python scripts/build_all.py

      - name: Run distribution validation
        run: python scripts/validate.py

      - name: Verify working tree is clean after generated build
        shell: bash
        run: |
          git status --short
          test -z "$(git status --short)"
