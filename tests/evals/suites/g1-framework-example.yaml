suite:
  id: G1
  name: Evalramverk sanity
  version: 1
  mandatory: false
tests:
- id: G1-EX-001
  title: Motion ska inte bli beslut
  category: evidence
  type: RULE
  prompt: 'En ledamot har lämnat en motion om att införa X. Vad har beslutats?

    '
  context:
    evidence:
      document_type: motion
      decision_found: false
  expected_behavior:
  - Klassificera motionen som PROPOSAL.
  - Säg att inget slutligt beslut kan fastställas från underlaget.
  must_not_include:
  - att X redan har beslutats
  severity: high
  pass_criteria:
    all_required_behaviors: true
    forbidden_behaviors_absent: true
  rules:
  - EVID-2
  - VERIFY-6
